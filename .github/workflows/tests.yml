name: tests

# There was no CI until 2026-09-07. PRs #20, #21 and #22 all merged showing `checks: 0`, so the
# only verification any of them got was somebody running the suite locally and saying so. That
# works until it doesn't, and it never catches the case where two branches are each fine alone.
#
# The last job is the one worth keeping. `npm publish` packs the WORKING TREE; git records what you
# added. On 2026-09-07 a `bin/` directory was referenced from package.json and never `git add`ed —
# `npm pack` included it, a fresh clone would not have had it, and the published package would have
# worked while the repo was broken. CI checks out from git, so packing and then running the CLI
# from the installed tarball is what makes that divergence fail here instead of downstream.

# BUDGET. GitHub bills macOS runners at 10x minutes and Windows at 2x. The full matrix was three
# macOS jobs, three Windows and three Linux, and the macOS third of it was roughly three quarters of
# the bill — for the one platform that gets tested by hand every day, because it is the machine this
# is written on. macOS moved to a weekly run and to workflow_dispatch. If a macOS-only bug is ever
# suspected, `gh workflow run tests.yml` is one command away.
#
# The push trigger said `master` and the branch is `main`, so from the rename until now a push ran
# nothing at all and only PRs were checked. Fixed here, which is why the matrix had to shrink first.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  schedule:
    # Sunday 06:00 UTC — the weekly macOS + full-matrix run.
    - cron: "0 6 * * 0"
  workflow_dispatch:

# A second push to the same branch cancels the first. Superseded runs were being paid for in full.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Two lists, picked by how the run started. An `os` x `node` product with a conditional
      # `include` would have run ubuntu/22 twice on an ordinary push, which is the opposite of
      # the point — `include` does not deduplicate.
      #
      # Windows stays on every run. Four of the bugs it found were real, and it is the platform
      # nobody here is holding. Node 20 and 24 are the ends of the supported range and are where
      # the version-dependent breaks were: the `--test` glob on 20, the coverage thresholds on 22+.
      matrix:
        include: ${{ fromJSON(
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && '[{"os":"ubuntu-latest","node":"20"},{"os":"ubuntu-latest","node":"22"},{"os":"ubuntu-latest","node":"24"},{"os":"windows-latest","node":"20"},{"os":"windows-latest","node":"22"},{"os":"windows-latest","node":"24"},{"os":"macos-latest","node":"20"},{"os":"macos-latest","node":"22"},{"os":"macos-latest","node":"24"}]'
          || '[{"os":"ubuntu-latest","node":"20"},{"os":"ubuntu-latest","node":"22"},{"os":"ubuntu-latest","node":"24"},{"os":"windows-latest","node":"20"},{"os":"windows-latest","node":"24"}]'
          ) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No dependencies to install — the package has none, which is part of the trust story.
      - name: There are still no runtime dependencies
        shell: bash
        run: |
          DEPS=$(node -p "Object.keys(require('./package.json').dependencies || {}).length")
          if [ "$DEPS" != "0" ]; then
            echo "::error::package.json gained $DEPS runtime dependencies. SECURITY.md says this package installs nothing at runtime; if that changed on purpose, change the claim too."
            exit 1
          fi

      - name: Unit tests
        shell: bash
        run: npm test

      - name: Solo smoke
        shell: bash
        run: npm run smoke:solo

      - name: Two-device smoke
        shell: bash
        run: npm run smoke:two-device

  coverage:
    name: coverage floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The --test-coverage-* thresholds landed in Node 22; the matrix above still runs 20.
          node-version: "22"

      # Measured over src/ only. Including test files pushes the aggregate up by three points and
      # measures the tests testing themselves, which is not the thing worth defending.
      #
      # The floor sits a couple of points under what the suite achieves so an honest refactor does
      # not break the build, while a real regression does. It is a RATCHET: when the numbers rise,
      # raise these. Raised 2026-09-07 to src-only 92.41 line / 77.51 branch / 91.84 functions,
      # after the branch graph was rebuilt around commit order and its geometry pinned by tests.
      - name: Coverage must not fall below the floor
        run: |
          node --import ./test/env-setup.js --test --experimental-test-coverage \
            --test-coverage-exclude='test/**' \
            --test-coverage-lines=90 \
            --test-coverage-branches=75 \
            --test-coverage-functions=89

  packaged:
    name: the packed tarball actually runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Packs from the git checkout, so anything referenced but untracked is simply absent here.
      - name: Pack, install into a clean directory, and run the CLI from it
        run: |
          set -euo pipefail
          TARBALL=$(npm pack --silent)
          WORK=$(mktemp -d)
          mkdir -p "$WORK/consumer"
          cd "$WORK/consumer"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/$TARBALL"

          # Both bin names, because both are published and each has broken independently before.
          ./node_modules/.bin/rooms help > /dev/null
          ./node_modules/.bin/iops-rooms help > /dev/null

          # A real room from the installed copy, not from the checkout.
          mkdir room && cd room
          # A runner has no git identity, and Rooms stamps the branch onto every event, so the
          # room needs a real repo with a real commit. Passed with -c rather than configured
          # globally, so the job does not depend on runner state it did not set up.
          git init -q .
          git -c user.email=ci@example.invalid -c user.name=ci commit -q --allow-empty -m ci
          ../node_modules/.bin/rooms init --name ci > /dev/null
          ../node_modules/.bin/rooms post "from the packed tarball" > /dev/null
          ../node_modules/.bin/rooms status

          test -s .room/events.jsonl || { echo "::error::installed CLI wrote no events"; exit 1; }
          test -s .room/board.html   || { echo "::error::installed CLI rendered no board"; exit 1; }

      - name: The skill and templates the package promises are inside it
        run: |
          set -euo pipefail
          TARBALL=$(npm pack --silent)
          # List once into a file rather than piping into `grep -q`. grep exits on the first match
          # and closes the pipe, tar takes SIGPIPE, and pipefail then reports the PIPELINE as
          # failed — so a file that WAS found is reported missing. It passed on macOS and failed on
          # the runner because bsdtar usually finishes before grep quits and GNU tar does not:
          # a race, won locally and lost in CI. No pipe, no race.
          tar -tzf "$TARBALL" > /tmp/tarball-listing.txt
          for want in package/skills/rooms/SKILL.md package/templates/board.html package/SECURITY.md; do
            if ! grep -qx "$want" /tmp/tarball-listing.txt; then
              echo "::error::$want is listed in package.json files but missing from the tarball"
              exit 1
            fi
          done

  action:
    name: the attribution action says the right thing, or nothing
    runs-on: ubuntu-latest
    steps:
      # Full history: the action compares a branch against a base, and a shallow clone has neither.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The body builder is a heredoc inside run.sh, which is where it belongs — it is three lines
      # of glue away from the shell that feeds it. Lifted out here so the decisions in it can be
      # tested against fixtures instead of only end to end against whatever this branch happens to
      # contain, which changes under the test.
      - name: Lift the comment builder out of the action
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          src = Path("actions/attribution/run.sh").read_text()
          block = src.split('python3 - "$report" "$body" <<\'PY\'\n', 1)[1].split("\nPY\n", 1)[0]
          Path("/tmp/build_comment.py").write_text(block)
          EOF

      - name: Nothing attributed means no comment at all
        run: |
          # The common case. 1.5% of commits across six well-known repositories carried a trailer,
          # so most pull requests land here — and a bot saying "0 agents found" every time is noise
          # that teaches people to scroll past the one that matters.
          cat > /tmp/none.json <<'EOF'
          {"attributed":0,"commits":{"seen":12},"rows":[{"id":"unrecorded","label":"no agent recorded","commits":12,"percent":100,"models":[]}],
           "multiAgentCommits":0,"declared":null,"floor":"every share is a floor"}
          EOF
          export GITHUB_OUTPUT=/tmp/out1; : > "$GITHUB_OUTPUT"
          python3 /tmp/build_comment.py /tmp/none.json /tmp/body1.md
          [ ! -s /tmp/body1.md ] || { echo "::error::it commented when nothing was attributed"; exit 1; }
          grep -q '^commented=false$' /tmp/out1 || { echo "::error::commented output should be false"; exit 1; }

      - name: The floor travels inside the comment, not behind a link
        run: |
          cat > /tmp/some.json <<'EOF'
          {"attributed":3,"commits":{"seen":10},
           "rows":[{"id":"claude","label":"Claude","commits":3,"percent":30,
                    "models":[{"label":"Claude Opus 5","commits":2},{"label":"Claude Opus 4.7","commits":1}]}],
           "multiAgentCommits":1,
           "declared":{"agents":[{"id":"claude","label":"Claude Code","files":["CLAUDE.md"]}],"crossVendorAgentsMd":false,"note":"n/a"},
           "floor":"SENTINEL-FLOOR-NOTE"}
          EOF
          export GITHUB_OUTPUT=/tmp/out2; : > "$GITHUB_OUTPUT"
          python3 /tmp/build_comment.py /tmp/some.json /tmp/body2.md
          cat /tmp/body2.md
          grep -q 'SENTINEL-FLOOR-NOTE' /tmp/body2.md || { echo "::error::the floor note is not in the comment body"; exit 1; }
          grep -q '3 of 10 commits' /tmp/body2.md || { echo "::error::expected a count, not a bare percentage"; exit 1; }
          grep -q 'Claude Opus 5' /tmp/body2.md || { echo "::error::models are not listed under the agent"; exit 1; }
          grep -qE 'records? more than one agent' /tmp/body2.md || { echo "::error::the overlap caveat is missing"; exit 1; }
          grep -q 'never that it was used' /tmp/body2.md || { echo "::error::the declared-is-not-used caveat is missing"; exit 1; }
          grep -q '<!-- iops-rooms-attribution -->' /tmp/body2.md || { echo "::error::no marker, so the comment cannot be updated in place"; exit 1; }

      - name: A percentage never appears on its own
        run: |
          # A bare "30%" on somebody's pull request is read by people who never ran this and will
          # not read a caveat. Counts are harder to misquote, so counts are what it prints.
          grep -qE '^\*\*[0-9]+ of [0-9]+ commits' /tmp/body2.md || { echo "::error::the headline should be a count"; exit 1; }

      - name: A refusal is handled as a refusal, not a finding
        run: |
          echo '{"ok":false,"reason":"on main already"}' > /tmp/refuse.json
          export GITHUB_OUTPUT=/tmp/out3; : > "$GITHUB_OUTPUT"
          python3 /tmp/build_comment.py /tmp/refuse.json /tmp/body3.md
          [ ! -s /tmp/body3.md ] || { echo "::error::it commented on a refusal"; exit 1; }
          grep -q '^commented=false$' /tmp/out3 || { echo "::error::a refusal should not report a comment"; exit 1; }

      # End to end against the PUBLISHED package, the way a caller's workflow runs it. Comment
      # posting is off: this job is not a pull request and has no business writing one.
      # The action runs `rooms branch --json`, and the published package only grew `--json` in the
      # version this branch introduces. So the end-to-end run can only happen once that ships:
      # until then the newest published build ignores the flag and prints prose, and the action
      # would fail on unparseable output for a reason that has nothing to do with the action.
      #
      # Skipped with the reason stated rather than removed, because it starts working on its own the
      # moment the release lands — and rather than pointed at the working tree, which would make it
      # a test of code nobody can install.
      # The posting half, with `gh` stubbed, because a workflow cannot open a pull request from a
      # fork to test itself. Every call is logged, and a write answers with whatever STUB says.
      - name: Stub gh for the posting tests
        run: |
          mkdir -p /tmp/ghstub
          cat > /tmp/ghstub/gh <<'STUB'
          #!/usr/bin/env bash
          echo "$*" >> "$GH_LOG"
          case "$*" in
            *"--method POST"*|*"--method PATCH"*)
              case "$STUB" in
                ok) exit 0 ;;
                403) echo "gh: Resource not accessible by integration (HTTP 403)" >&2; exit 1 ;;
                500) echo "gh: Internal Server Error (HTTP 500)" >&2; exit 1 ;;
              esac ;;
          esac
          exit 0
          STUB
          chmod +x /tmp/ghstub/gh
          printf 'body\n' > /tmp/body.md

      - name: A fork is not a failed check, and costs no request
        env: { HEAD_REPO: someone/fork, REPO: i-ops-hq/iops-rooms, PR_NUMBER: "7", STUB: "403", GH_LOG: /tmp/gh-fork.log }
        run: |
          : > "$GH_LOG"; out=$(mktemp)
          PATH="/tmp/ghstub:$PATH" GITHUB_OUTPUT="$out" bash actions/attribution/post.sh /tmp/body.md
          grep -q '^commented=false$' "$out" || { echo "::error::a fork should report commented=false"; exit 1; }
          [ ! -s "$GH_LOG" ] || { echo "::error::the fork was noticed only after calling the API"; exit 1; }

      - name: A token that cannot write says so, and passes
        env: { HEAD_REPO: i-ops-hq/iops-rooms, REPO: i-ops-hq/iops-rooms, PR_NUMBER: "7", STUB: "403", GH_LOG: /tmp/gh-403.log }
        run: |
          out=$(mktemp)
          PATH="/tmp/ghstub:$PATH" GITHUB_OUTPUT="$out" bash actions/attribution/post.sh /tmp/body.md > /tmp/said.txt
          grep -q '^commented=false$' "$out" || { echo "::error::a 403 should report commented=false"; exit 1; }
          grep -q 'cannot write' /tmp/said.txt || { echo "::error::a 403 should say why"; exit 1; }

      - name: Any other failure still fails
        env: { HEAD_REPO: i-ops-hq/iops-rooms, REPO: i-ops-hq/iops-rooms, PR_NUMBER: "7", STUB: "500", GH_LOG: /tmp/gh-500.log }
        run: |
          out=$(mktemp)
          if PATH="/tmp/ghstub:$PATH" GITHUB_OUTPUT="$out" bash actions/attribution/post.sh /tmp/body.md; then
            echo "::error::a server error was swallowed"; exit 1
          fi
          if grep -q '^commented=' "$out"; then echo "::error::a failed post reported an outcome"; exit 1; fi

      - name: Can the published package do what the action needs?
        id: published
        run: |
          VERSION=$(npm view iops-rooms version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npx --yes "iops-rooms@$VERSION" week --since 1d --json 2>&1 | head -1 | grep -q '^{'; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=rooms::iops-rooms@$VERSION has no --json yet, so the end-to-end step is skipped until this release ships"
          fi

      - name: The action runs end to end against the published package
        id: live
        if: steps.published.outputs.ready == 'true'
        uses: ./actions/attribution
        with:
          base: main
          comment: "false"
          version: ${{ steps.published.outputs.version }}

      - name: An unpublished pin fails with a message that names the cause
        id: badpin
        continue-on-error: true
        uses: ./actions/attribution
        with:
          base: main
          comment: "false"
          version: "0.0.0-does-not-exist"

      - name: "...rather than a bare `sh: rooms: not found`"
        run: |
          [ "${{ steps.badpin.outcome }}" = "failure" ] || { echo "::error::an unpublished pin should fail"; exit 1; }

      - name: ...and reports what it read
        if: steps.published.outputs.ready == 'true'
        run: |
          echo "attributed=${{ steps.live.outputs.attributed }} seen=${{ steps.live.outputs.seen }}"
          [ "${{ steps.live.outputs.commented }}" = "false" ] || { echo "::error::it posted a comment with comment:false"; exit 1; }
