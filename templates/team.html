<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    <!--
      The team board. Its design tokens are the project board's, copied, and a test fails if the two
      drift apart. No remote CSS, fonts or scripts: it is a file built on the viewer's machine.
    -->
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      :root {
        --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-display: "Plus Jakarta Sans", var(--font);
        --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        --ink: #14151a;
        --ink-2: #5b606b;
        --ink-3: #8a8f99;
        --line: #e9eaed;
        --line-2: #f0f0f2;
        --bg: #ffffff;
        --bg-soft: #f5f5f3;
        --card: #ffffff;
        --btn: #16171c;
        --btn-fg: #ffffff;
        --sky-top: #7fb2e6;
        --sky-mid: #a9cdf0;
        --sky-bot: #e9f1f8;
        --blue: #2f6fed;
        --green: #1e9e5a;
        --amber: #c98a16;
        --violet: #6d5ae0;
        --glass: rgba(255, 255, 255, 0.72);
        --glass-edge: rgba(255, 255, 255, 0.7);
        --r-lg: 24px;
        --r-xl: 32px;
        --r-pill: 999px;
        --shadow-sm: 0 1px 2px rgba(20, 21, 26, 0.05), 0 1px 3px rgba(20, 21, 26, 0.06);
        --shadow-md: 0 10px 30px rgba(20, 21, 26, 0.08), 0 2px 8px rgba(20, 21, 26, 0.05);
        --maxw: 860px;
        --gutter: 32px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f3f5f9;
          --ink-2: #a7afbe;
          --ink-3: #79808f;
          --line: #242833;
          --line-2: #1c1f28;
          --bg: #0d0f14;
          --bg-soft: #12141b;
          --card: #161922;
          --btn: #f3f5f9;
          --btn-fg: #0d0f14;
          --sky-top: #1e3a5f;
          --sky-mid: #1a2c47;
          --sky-bot: #12141b;
          --blue: #6a9bff;
          --green: #3fbf7d;
          --amber: #e0a53c;
          --violet: #9b8cf5;
          --glass: rgba(22, 25, 34, 0.72);
          --glass-edge: rgba(255, 255, 255, 0.06);
          --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
          --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.45), 0 2px 8px rgba(0, 0, 0, 0.3);
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font);
        font-size: 17px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      h1 {
        margin: 0;
        font-family: var(--font-display);
        text-wrap: balance;
      }
      p {
        margin: 0;
      }
      .wrap {
        width: 100%;
        max-width: var(--maxw);
        margin: 0 auto;
        padding: 0 var(--gutter);
      }
      .hero {
        padding: 64px 0 88px;
        background: linear-gradient(
          180deg,
          var(--sky-top) 0%,
          var(--sky-mid) 34%,
          var(--sky-bot) 74%,
          var(--bg) 100%
        );
      }
      .eyebrow {
        display: inline-block;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-2);
        padding: 8px 18px;
        border: 1px solid var(--glass-edge);
        border-radius: var(--r-pill);
        background: var(--glass);
        backdrop-filter: saturate(160%) blur(10px);
      }
      .h-display {
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 0.96;
        font-size: clamp(36px, 6vw, 64px);
        margin: 22px 0 0;
      }
      .lead {
        font-size: 18px;
        color: var(--ink-2);
        margin: 18px 0 0;
        max-width: 46ch;
      }
      .stage { padding: 0 0 80px; }
      .note {
        background: var(--bg-soft);
        border-radius: var(--r-lg);
        padding: 16px 20px;
        margin: 0 0 22px;
        color: var(--ink-2);
        font-size: 14px;
      }
      .team-project {
        margin: 0 0 22px;
        padding: 16px 18px 18px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow-sm);
      }
      .team-project h2 { font-family: var(--font-display); font-size: 17px; font-weight: 600; margin: 0 0 12px; }
      .members { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
      .member { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 13px; min-width: 0; overflow-wrap: anywhere; }
      .member-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 0 0 6px; }
      .member-head b { font-size: 14px; }
      .member-when { color: var(--ink-3); font-size: 12px; }
      .member-branch { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); margin: 0 0 6px; }
      .member-line { color: var(--ink-2); margin: 2px 0 0; }
      .member-line[data-state="warn"]::before { content: "! "; color: var(--amber); }
      .member-line[data-state="ok"]::before { content: "✓ "; color: var(--green); }
      .member-line[data-state="none"]::before { content: "— "; color: var(--ink-3); }
      .member-agents { color: var(--ink-3); font-size: 12px; margin: 6px 0 0; }
      .empty { color: var(--ink-2); font-size: 15px; }
      .checked { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); margin: 14px 0 0; }
      @media (max-width: 720px) { .wrap { padding: 0 16px; } }
    </style>
  </head>
  <body>
    <header class="hero">
      <div class="wrap">
        <span class="eyebrow">I-Ops · Rooms · Team</span>
        <h1 class="h-display">{{NAME}}</h1>
        <p class="lead">{{SUMMARY}}</p>
        {{CHECKED}}
      </div>
    </header>
    <main class="wrap stage">
      <p class="note">{{NOTE}}</p>
      {{PROJECTS}}
    </main>
  </body>
</html>
